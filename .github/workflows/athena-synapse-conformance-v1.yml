name: ATHENA Synapse V1 Conformance

on:
  pull_request:
    paths:
      - "tools/athena_synapse_*.py"
      - "schemas/athena_synapse_*.json"
      - "registry/ATHENA_SYNAPSE_NODES_V1.json"
      - "registry/ATHENA_CORE_SYNAPSE_SOURCE_PIN_V1.json"
      - "fixtures/athena_synapse_*.json"
      - "fixtures/athena_core_synapse_*.json"
      - "tests/test_athena_synapse_*.py"
      - ".github/workflows/athena-synapse-conformance-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/athena_synapse_*.py"
      - "schemas/athena_synapse_*.json"
      - "registry/ATHENA_SYNAPSE_NODES_V1.json"
      - "registry/ATHENA_CORE_SYNAPSE_SOURCE_PIN_V1.json"
      - "fixtures/athena_synapse_*.json"
      - "fixtures/athena_core_synapse_*.json"
      - "tests/test_athena_synapse_*.py"
      - ".github/workflows/athena-synapse-conformance-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synapse-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile boundary tools
        run: |
          python -m py_compile \
            tools/athena_synapse_conformance.py \
            tools/athena_synapse_registry_audit.py \
            tools/athena_synapse_manifest_audit.py
      - name: Audit Core source pin and access standing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          row = json.loads(Path('registry/ATHENA_CORE_SYNAPSE_SOURCE_PIN_V1.json').read_text(encoding='utf-8'))
          producer = row['producer']
          evidence = row['producer_execution_evidence']
          assert producer['repository'] == 'demeet2k/Athena'
          assert producer['pull_request'] == 3431
          assert len(producer['producer_revision']) == 40
          assert len(producer['native_packet_revision']) == 40
          assert producer['profile'] == 'FEDERATION_SYNAPSE_PACKET_V1'
          assert evidence['source_equivalent_tests'] == 25
          assert evidence['source_equivalent_failures'] == 0
          assert evidence['guild_cross_repository_checkout'] == 'UNAVAILABLE'
          assert evidence['branch_exact_core_execution_from_guild'] == 'UNOBSERVED'
          assert row['standing'] == 'PINNED_VECTOR_ABI_VERIFIED_PRODUCER_BRANCH_EXACT_EXECUTION_UNOBSERVED'
          print('CORE_SOURCE_PIN_AND_ACCESS_STANDING_PASS')
          PY
      - name: Audit node admission registry
        run: |
          python tools/athena_synapse_registry_audit.py registry/ATHENA_SYNAPSE_NODES_V1.json
      - name: Validate golden Synapse envelopes
        run: |
          python tools/athena_synapse_conformance.py validate fixtures/athena_synapse_vectors_v1.json
      - name: Verify causal ordering and conservative GC surfaces
        run: |
          python tools/athena_synapse_conformance.py causal fixtures/athena_synapse_vectors_v1.json
          python tools/athena_synapse_conformance.py gc fixtures/athena_synapse_vectors_v1.json
      - name: Run focused Python tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_athena_synapse_conformance.py \
            tests/test_athena_synapse_registry_audit.py \
            tests/test_athena_synapse_manifest_audit.py \
            tests/test_athena_synapse_core_packet_profile.py
