name: ATHENA Synapse V1 Conformance

on:
  pull_request:
    paths:
      - "tools/athena_synapse_*.py"
      - "schemas/athena_synapse_*.json"
      - "registry/ATHENA_SYNAPSE_NODES_V1.json"
      - "fixtures/athena_synapse_*.json"
      - "fixtures/athena_core_synapse_*.json"
      - "tests/test_athena_synapse_*.py"
      - ".github/workflows/athena-synapse-conformance-v1.yml"
  push:
    branches: [main]
    paths:
      - "tools/athena_synapse_*.py"
      - "schemas/athena_synapse_*.json"
      - "registry/ATHENA_SYNAPSE_NODES_V1.json"
      - "fixtures/athena_synapse_*.json"
      - "fixtures/athena_core_synapse_*.json"
      - "tests/test_athena_synapse_*.py"
      - ".github/workflows/athena-synapse-conformance-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synapse-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout pinned Core Synapse producer
        uses: actions/checkout@v4
        with:
          repository: demeet2k/Athena
          ref: 69ddee368b20e54c4fb14f4763b933d27445e0da
          path: _interop/athena-core
          persist-credentials: false
          fetch-depth: 1
      - name: Execute pinned Core packet bridge regressions
        working-directory: _interop/athena-core
        run: |
          python -m unittest -v \
            tests.test_federation_synapse_envelope_bridge_v1 \
            tests.test_federation_synapse_envelope_vector_v1
      - name: Verify frozen Core envelope has not drifted
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          guild = json.loads(Path('fixtures/athena_core_synapse_packet_envelope_v1.json').read_text(encoding='utf-8'))
          core = json.loads(Path('_interop/athena-core/fixtures/athena_federation_synapse_packet_envelope_v1.json').read_text(encoding='utf-8'))

          assert guild['source']['core_base_revision'] == core['source_revision']
          assert guild['source']['profile'] == core['expected']['projection_profile']
          assert guild['envelope'] == core['envelope']
          for key in ('event_id', 'packet_digest', 'body_digest', 'envelope_digest'):
              assert guild['expected'][key] == core['expected'][key], key
          print('CORE_GUILD_SYNAPSE_VECTOR_EXACT_MATCH')
          PY
      - name: Compile boundary tools
        run: |
          python -m py_compile \
            tools/athena_synapse_conformance.py \
            tools/athena_synapse_registry_audit.py \
            tools/athena_synapse_manifest_audit.py
      - name: Audit node admission registry
        run: |
          python tools/athena_synapse_registry_audit.py registry/ATHENA_SYNAPSE_NODES_V1.json
      - name: Validate golden Synapse envelopes
        run: |
          python tools/athena_synapse_conformance.py validate fixtures/athena_synapse_vectors_v1.json
      - name: Verify causal ordering and conservative GC surfaces
        run: |
          python tools/athena_synapse_conformance.py causal fixtures/athena_synapse_vectors_v1.json
          python tools/athena_synapse_conformance.py gc fixtures/athena_synapse_vectors_v1.json
      - name: Run focused Python tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_athena_synapse_conformance.py \
            tests/test_athena_synapse_registry_audit.py \
            tests/test_athena_synapse_manifest_audit.py \
            tests/test_athena_synapse_core_packet_profile.py
