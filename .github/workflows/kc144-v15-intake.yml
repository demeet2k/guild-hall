name: KC144 V15 public application intake

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing KC144 V15 application issue to verify
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: kc144-v15-intake-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[KC144 V15 APPLICATION]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out public ingress adapter
        uses: actions/checkout@v4

      - name: Resolve event
        id: event
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let issue = context.payload.issue;
            if (context.eventName === 'workflow_dispatch') {
              const number = Number('${{ inputs.issue_number }}');
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number
              });
              issue = response.data;
            }
            if (!issue || !issue.title.startsWith('[KC144 V15 APPLICATION]')) {
              core.setFailed('Target is not a KC144 V15 application issue.');
              return;
            }
            const synthetic = {
              action: context.payload.action || 'workflow_dispatch',
              issue,
              repository: { full_name: `${context.repo.owner}/${context.repo.repo}` },
              sender: context.payload.sender || { login: context.actor }
            };
            fs.writeFileSync(process.env.RUNNER_TEMP + '/event.json',
              JSON.stringify(synthetic));
            core.setOutput('issue_number', String(issue.number));

      - name: Extract and bind public application
        run: |
          python3 tools/kc144_v15_issue_intake.py extract \
            --event "$RUNNER_TEMP/event.json" \
            --application "$RUNNER_TEMP/application.json" \
            --context "$RUNNER_TEMP/context.json"

      - name: Check out immutable KC144 V15 verifier
        uses: actions/checkout@v4
        with:
          ref: 1b653e39d7c09ba8b93a800860244242cd98d397
          path: crystal

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crystal/pyproject.toml

      - name: Install exact verifier runtime
        run: python -m pip install --disable-pip-version-check ./crystal

      - name: Verify immutable batch and both signatures
        id: verify
        shell: bash
        run: |
          checked_at="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/context.json"))["checked_at"])')"
          set +e
          PYTHONPATH=crystal/src python -m kc144_crystal \
            candidate-application-verify \
            crystal/registry/v11/governance_challenge_batch_v11.json \
            "$RUNNER_TEMP/application.json" \
            --checked-at "$checked_at" \
            > "$RUNNER_TEMP/verification.json" \
            2> "$RUNNER_TEMP/verifier.stderr"
          verifier_exit=$?
          set -e
          echo "verifier_exit=$verifier_exit" >> "$GITHUB_OUTPUT"

      - name: Build non-promotive receipt
        id: receipt
        shell: bash
        run: |
          set +e
          python3 tools/kc144_v15_issue_intake.py receipt \
            --context "$RUNNER_TEMP/context.json" \
            --report "$RUNNER_TEMP/verification.json" \
            --stderr "$RUNNER_TEMP/verifier.stderr" \
            --verifier-exit "${{ steps.verify.outputs.verifier_exit }}" \
            --output "$RUNNER_TEMP/receipt.json"
          receipt_exit=$?
          set -e
          echo "receipt_exit=$receipt_exit" >> "$GITHUB_OUTPUT"
          python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"] + "/receipt.json")); print("verdict=" + r["transport_verdict"]); print("receipt_digest=" + r["receipt_digest"])' >> "$GITHUB_OUTPUT"

      - name: Preserve replay capsule
        uses: actions/upload-artifact@v4
        with:
          name: kc144-v15-intake-issue-${{ steps.event.outputs.issue_number }}-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/verification.json
            ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish deterministic receipt
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.event.outputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const receipt = JSON.parse(
              fs.readFileSync(process.env.RUNNER_TEMP + '/receipt.json', 'utf8')
            );
            const marker = `<!-- kc144-v15-intake:${receipt.receipt_digest} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              per_page: 100
            });
            if (comments.some(comment => comment.body && comment.body.includes(marker))) {
              core.info('Identical receipt already published; replay is idempotent.');
              return;
            }
            const icon = receipt.transport_verdict === 'PASS' ? '✅' : '⏸️';
            const body = [
              marker,
              `## ${icon} KC144 V15 transport receipt`,
              '',
              `- Transport verdict: \`${receipt.transport_verdict}\``,
              `- Intake state: \`${receipt.intake_state}\``,
              `- Application: \`${receipt.application_id}\``,
              `- Application digest: \`${receipt.application_sha256}\``,
              `- Receipt: \`${receipt.receipt_digest}\``,
              `- Frozen verifier commit: \`${receipt.base_commit}\``,
              `- Return: \`${receipt.return_address}\``,
              '',
              'A transport PASS verifies schema, immutable batch/call bindings, timing, and both ED25519 signatures. It does **not** independently prove identity, independence, fitness, cohort selection, packet delivery, governance authority, certification, or truth.',
              '',
              '<details><summary>Machine-readable receipt</summary>',
              '',
              '```json',
              JSON.stringify(receipt, null, 2),
              '```',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body
            });

      - name: Write run summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "receipt.json").read_text()
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "# KC144 V15 application intake\n\n"
              f"- Verdict: `{receipt['transport_verdict']}`\n"
              f"- State: `{receipt['intake_state']}`\n"
              f"- Receipt: `{receipt['receipt_digest']}`\n"
              f"- Return: `{receipt['return_address']}`\n\n"
              "Truth effect: `NONE`; governance authority: `FALSE`.\n"
          )
          PY

      - name: Hold invalid transport
        if: steps.receipt.outputs.receipt_exit != '0'
        run: |
          echo "Application remains HOLD; the public receipt preserves the failed checks."
          exit 1
